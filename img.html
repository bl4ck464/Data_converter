<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Background Remover – Make White Transparent</title>
    <style>
        /* ---------- Reset & Base ---------- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app {
            max-width: 1200px;
            width: 100%;
            background: #16213e;
            border-radius: 32px;
            padding: 36px 40px 44px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #f0f4ff;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        h1 small {
            font-size: 16px;
            font-weight: 400;
            color: #8892b0;
            letter-spacing: 0;
        }

        .subhead {
            color: #8892b0;
            margin-top: 6px;
            font-size: 15px;
            border-left: 3px solid #4f46e5;
            padding-left: 16px;
            margin-bottom: 28px;
        }

        /* ---------- Upload Zone ---------- */
        .upload-zone {
            border: 2px dashed rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 48px 20px;
            text-align: center;
            background: rgba(255, 255, 255, 0.03);
            transition: border-color 0.25s, background 0.25s;
            cursor: pointer;
            position: relative;
        }

        .upload-zone:hover {
            border-color: #4f46e5;
            background: rgba(79, 70, 229, 0.06);
        }

        .upload-zone.dragover {
            border-color: #4f46e5;
            background: rgba(79, 70, 229, 0.12);
        }

        .upload-zone .icon {
            font-size: 48px;
            margin-bottom: 10px;
            display: block;
        }

        .upload-zone p {
            color: #c8d0e0;
            font-size: 17px;
        }

        .upload-zone .hint {
            color: #6b7a9e;
            font-size: 14px;
            margin-top: 6px;
        }

        #fileInput {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        /* ---------- Controls Bar ---------- */
        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 24px 40px;
            margin-top: 28px;
            padding: 18px 22px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .control-group label {
            color: #b0bbd8;
            font-weight: 500;
            font-size: 14px;
            letter-spacing: 0.3px;
        }

        .control-group input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 160px;
            height: 6px;
            border-radius: 4px;
            background: #2a3555;
            outline: none;
            transition: background 0.2s;
        }

        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #4f46e5;
            cursor: pointer;
            border: 2px solid #f0f4ff;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
            transition: transform 0.15s;
        }

        .control-group input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.12);
        }

        .control-group input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #4f46e5;
            cursor: pointer;
            border: 2px solid #f0f4ff;
        }

        .tolerance-value {
            min-width: 36px;
            font-weight: 600;
            color: #f0f4ff;
            font-size: 16px;
            text-align: center;
        }

        .btn {
            background: #4f46e5;
            border: none;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            padding: 10px 24px;
            border-radius: 40px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.3px;
        }

        .btn:hover {
            background: #6366f1;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-outline {
            background: transparent;
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            color: #c8d0e0;
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.25);
        }

        .btn-success {
            background: #059669;
        }
        .btn-success:hover {
            background: #10b981;
        }

        /* ---------- Preview Area ---------- */
        .preview-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
            margin-top: 28px;
        }

        @media (max-width: 700px) {
            .preview-area {
                grid-template-columns: 1fr;
            }
            .app {
                padding: 20px 16px 28px;
            }
            .controls {
                flex-direction: column;
                align-items: stretch;
                gap: 14px;
            }
            .control-group {
                justify-content: center;
            }
            .control-group input[type="range"] {
                width: 120px;
            }
        }

        .preview-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 14px 14px 18px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .preview-card .label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            color: #8892b0;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }

        .preview-card .label .badge {
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 11px;
            color: #b0bbd8;
        }

        .canvas-wrapper {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            background: repeating-conic-gradient(#e8ecf4 0% 25%, #d0d6e4 0% 50%) 0 0 / 20px 20px;
            aspect-ratio: 1 / 1;
            max-height: 480px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .canvas-wrapper canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: auto;
        }

        .canvas-wrapper .placeholder {
            color: #6b7a9e;
            font-size: 15px;
            text-align: center;
            padding: 20px;
        }

        .canvas-wrapper .placeholder span {
            display: block;
            font-size: 36px;
            margin-bottom: 10px;
        }

        .btn-download-wrap {
            margin-top: 14px;
            text-align: right;
        }

        /* ---------- Status / Info ---------- */
        .status {
            margin-top: 18px;
            color: #6b7a9e;
            font-size: 14px;
            text-align: center;
            min-height: 24px;
        }

        .status.success {
            color: #34d399;
        }

        /* ---------- Scroll ---------- */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a3555;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3d4a6f;
        }

        /* ---------- Animations ---------- */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .preview-area {
            animation: fadeIn 0.35s ease-out;
        }

        /* ---------- File name ---------- */
        .file-name {
            color: #8892b0;
            font-size: 13px;
            margin-top: 4px;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div class="app">
        <!-- Header -->
        <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:12px;">
            <div>
                <h1>
                    ✧ BG Remover
                    <small>white → transparent</small>
                </h1>
                <div class="subhead">
                    Remove white or light backgrounds with adjustable tolerance
                </div>
            </div>
            <div style="display:flex; gap:10px; align-items:center;">
                <span id="fileName" class="file-name">No image loaded</span>
            </div>
        </div>

        <!-- Upload -->
        <div class="upload-zone" id="uploadZone">
            <span class="icon">🖼️</span>
            <p><strong>Drop your image here</strong> &nbsp;or&nbsp; click to browse</p>
            <div class="hint">Supports PNG, JPG, WEBP, BMP, GIF</div>
            <input type="file" id="fileInput" accept="image/*" />
        </div>

        <!-- Controls -->
        <div class="controls" id="controls" style="display:none;">
            <div class="control-group">
                <label for="toleranceSlider">Tolerance</label>
                <input type="range" id="toleranceSlider" min="0" max="100" value="30" />
                <span class="tolerance-value" id="toleranceDisplay">30</span>
            </div>
            <div class="control-group">
                <label for="smoothingSlider">Smoothing</label>
                <input type="range" id="smoothingSlider" min="0" max="20" value="3" />
                <span class="tolerance-value" id="smoothingDisplay">3</span>
            </div>
            <div style="display:flex; gap:10px; flex-wrap:wrap; margin-left:auto;">
                <button class="btn btn-success" id="downloadBtn">⬇ Download PNG</button>
                <button class="btn btn-outline" id="resetBtn">↺ Reset</button>
            </div>
        </div>

        <!-- Preview -->
        <div class="preview-area" id="previewArea" style="display:none;">
            <div class="preview-card">
                <div class="label">
                    <span>🔄 Original</span>
                    <span class="badge">input</span>
                </div>
                <div class="canvas-wrapper" id="originalWrapper">
                    <canvas id="originalCanvas"></canvas>
                </div>
            </div>
            <div class="preview-card">
                <div class="label">
                    <span>✨ Transparent</span>
                    <span class="badge">output</span>
                </div>
                <div class="canvas-wrapper" id="resultWrapper">
                    <canvas id="resultCanvas"></canvas>
                </div>
                <div class="btn-download-wrap">
                    <button class="btn btn-success" id="downloadBtn2" style="font-size:13px; padding:8px 18px;">
                        ⬇ Download PNG
                    </button>
                </div>
            </div>
        </div>

        <!-- Status -->
        <div class="status" id="status">Upload an image to get started</div>
    </div>

    <script>
        (function() {
            'use strict';

            // ---------- DOM refs ----------
            const fileInput = document.getElementById('fileInput');
            const uploadZone = document.getElementById('uploadZone');
            const controls = document.getElementById('controls');
            const previewArea = document.getElementById('previewArea');
            const status = document.getElementById('status');
            const fileName = document.getElementById('fileName');

            const originalCanvas = document.getElementById('originalCanvas');
            const resultCanvas = document.getElementById('resultCanvas');
            const ctxOrig = originalCanvas.getContext('2d');
            const ctxResult = resultCanvas.getContext('2d');

            const toleranceSlider = document.getElementById('toleranceSlider');
            const smoothingSlider = document.getElementById('smoothingSlider');
            const toleranceDisplay = document.getElementById('toleranceDisplay');
            const smoothingDisplay = document.getElementById('smoothingDisplay');

            const downloadBtn = document.getElementById('downloadBtn');
            const downloadBtn2 = document.getElementById('downloadBtn2');
            const resetBtn = document.getElementById('resetBtn');

            // ---------- State ----------
            let originalImage = null; // HTMLImageElement
            let originalImageData = null; // ImageData (original, untouched)
            let processedImageData = null; // ImageData (current processed version)
            let currentTolerance = 30;
            let currentSmoothing = 3;
            let isProcessing = false;

            // ---------- Helpers ----------
            function setStatus(msg, type = '') {
                status.textContent = msg;
                status.className = 'status' + (type ? ' ' + type : '');
            }

            function showError(msg) {
                setStatus('⚠️ ' + msg, '');
            }

            function showSuccess(msg) {
                setStatus('✅ ' + msg, 'success');
            }

            // ---------- Image loading ----------
            function loadImage(file) {
                if (!file || !file.type.startsWith('image/')) {
                    showError('Please select a valid image file.');
                    return;
                }

                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        originalImage = img;
                        fileName.textContent = file.name;
                        initCanvas(img);
                        processImage();
                        controls.style.display = 'flex';
                        previewArea.style.display = 'grid';
                        showSuccess(`Loaded "${file.name}" — ${img.width}×${img.height}`);
                    };
                    img.onerror = function() {
                        showError('Failed to decode image. Try another file.');
                    };
                    img.src = e.target.result;
                };
                reader.onerror = function() {
                    showError('Failed to read file.');
                };
                reader.readAsDataURL(file);
            }

            // ---------- Canvas init ----------
            function initCanvas(img) {
                const w = img.width;
                const h = img.height;

                // Limit canvas size for performance, but keep aspect ratio
                const MAX_DIM = 1200;
                let drawW = w,
                    drawH = h;
                if (w > MAX_DIM || h > MAX_DIM) {
                    const scale = Math.min(MAX_DIM / w, MAX_DIM / h);
                    drawW = Math.round(w * scale);
                    drawH = Math.round(h * scale);
                }

                originalCanvas.width = drawW;
                originalCanvas.height = drawH;
                resultCanvas.width = drawW;
                resultCanvas.height = drawH;

                // Draw original
                ctxOrig.clearRect(0, 0, drawW, drawH);
                ctxOrig.drawImage(img, 0, 0, drawW, drawH);

                // Store original image data
                originalImageData = ctxOrig.getImageData(0, 0, drawW, drawH);
                // Clone for processing
                processedImageData = new ImageData(
                    new Uint8ClampedArray(originalImageData.data),
                    originalImageData.width,
                    originalImageData.height
                );
            }

            // ---------- Core: remove white background ----------
            function removeWhiteBackground(imageData, tolerance, smoothing) {
                const data = imageData.data;
                const w = imageData.width;
                const h = imageData.height;
                const len = data.length;

                // Clamp tolerance 0-100, smoothing 0-20
                const t = Math.min(100, Math.max(0, tolerance));
                const smooth = Math.min(20, Math.max(0, smoothing));

                // Convert tolerance to a threshold (0-255)
                // tolerance 0 → only pure white (255,255,255) removed
                // tolerance 100 → all colors removed (aggressive)
                const threshold = (t / 100) * 255;

                // For each pixel, compute distance from white
                // We'll use a simple luminance + chroma approach
                // Distance from (255,255,255) in RGB space
                for (let i = 0; i < len; i += 4) {
                    const r = data[i];
                    const g = data[i + 1];
                    const b = data[i + 2];
                    const a = data[i + 3];

                    // If already transparent, skip
                    if (a === 0) continue;

                    // Distance from white (Euclidean in RGB)
                    const dr = 255 - r;
                    const dg = 255 - g;
                    const db = 255 - b;
                    const dist = Math.sqrt(dr * dr + dg * dg + db * db);

                    // If distance is within threshold, make transparent
                    if (dist <= threshold) {
                        // Smoothing: instead of hard cut, fade alpha based on distance
                        if (smooth > 0 && dist > 0) {
                            const factor = Math.min(1, (dist / threshold) * (1 + smooth / 10));
                            const alpha = Math.round(factor * 255);
                            data[i + 3] = Math.min(255, alpha);
                        } else {
                            data[i + 3] = 0;
                        }
                    }
                    // Optionally, if distance is very close but not within threshold, we could apply partial
                    else if (smooth > 0 && dist < threshold * 1.5) {
                        const factor = Math.min(1, (dist - threshold) / (threshold * 0.5));
                        const alpha = Math.round(factor * 255);
                        data[i + 3] = Math.min(255, alpha);
                    }
                }

                return imageData;
            }

            // ---------- Process ----------
            function processImage() {
                if (!originalImageData || isProcessing) return;

                isProcessing = true;
                setStatus('⏳ Processing…');

                // Use requestAnimationFrame to avoid blocking UI
                requestAnimationFrame(() => {
                    try {
                        // Clone original data
                        const srcData = originalImageData.data;
                        const w = originalImageData.width;
                        const h = originalImageData.height;

                        const newData = new Uint8ClampedArray(srcData);
                        const tempImageData = new ImageData(newData, w, h);

                        // Apply background removal
                        const result = removeWhiteBackground(
                            tempImageData,
                            currentTolerance,
                            currentSmoothing
                        );

                        // Store processed data
                        processedImageData = new ImageData(
                            new Uint8ClampedArray(result.data),
                            result.width,
                            result.height
                        );

                        // Draw to result canvas
                        ctxResult.putImageData(processedImageData, 0, 0);

                        isProcessing = false;
                        showSuccess(`Background removed (tolerance: ${currentTolerance}, smoothing: ${currentSmoothing})`);
                    } catch (err) {
                        isProcessing = false;
                        showError('Processing error: ' + err.message);
                        console.error(err);
                    }
                });
            }

            // ---------- Re-process on slider change ----------
            function updateFromSliders() {
                currentTolerance = parseInt(toleranceSlider.value, 10);
                currentSmoothing = parseInt(smoothingSlider.value, 10);
                toleranceDisplay.textContent = currentTolerance;
                smoothingDisplay.textContent = currentSmoothing;

                if (originalImageData) {
                    processImage();
                }
            }

            // ---------- Reset ----------
            function resetAll() {
                if (!originalImageData) return;
                // Reset sliders to default
                toleranceSlider.value = 30;
                smoothingSlider.value = 3;
                toleranceDisplay.textContent = '30';
                smoothingDisplay.textContent = '3';
                currentTolerance = 30;
                currentSmoothing = 3;

                // Re-process
                processImage();
                showSuccess('Reset to defaults');
            }

            // ---------- Download ----------
            function downloadResult() {
                if (!processedImageData) {
                    showError('No processed image to download.');
                    return;
                }

                try {
                    const w = processedImageData.width;
                    const h = processedImageData.height;
                    const canvas = document.createElement('canvas');
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.putImageData(processedImageData, 0, 0);

                    const link = document.createElement('a');
                    link.download = 'transparent-bg.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    showSuccess('Downloaded!');
                } catch (err) {
                    showError('Download failed: ' + err.message);
                }
            }

            // ---------- Drag & Drop ----------
            function setupDragDrop() {
                uploadZone.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    uploadZone.classList.add('dragover');
                });

                uploadZone.addEventListener('dragleave', (e) => {
                    e.preventDefault();
                    uploadZone.classList.remove('dragover');
                });

                uploadZone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    uploadZone.classList.remove('dragover');
                    const files = e.dataTransfer.files;
                    if (files.length > 0) {
                        loadImage(files[0]);
                    }
                });

                fileInput.addEventListener('change', (e) => {
                    if (fileInput.files.length > 0) {
                        loadImage(fileInput.files[0]);
                    }
                });

                // Click on zone triggers file input
                uploadZone.addEventListener('click', (e) => {
                    if (e.target === fileInput) return;
                    fileInput.click();
                });
            }

            // ---------- Resize observer for canvas ----------
            function fitCanvasToWrapper() {
                // The canvases are already sized to image dimensions,
                // but we want them to fill their containers visually.
                // CSS handles this with width:100%; height:100%; object-fit:contain.
                // So we just need to make sure the wrapper has the right aspect ratio.
                // We'll let CSS handle it with aspect-ratio property.
                // Actually we set aspect-ratio: 1/1 on wrapper, but we want to match image aspect.
                // Let's dynamically set the wrapper's aspect ratio.

                const wrappers = document.querySelectorAll('.canvas-wrapper');
                if (originalImageData) {
                    const w = originalImageData.width;
                    const h = originalImageData.height;
                    const ratio = w / h;
                    wrappers.forEach(wrapper => {
                        wrapper.style.aspectRatio = ratio;
                    });
                }
            }

            // ---------- Init ----------
            function init() {
                setupDragDrop();

                // Slider events
                toleranceSlider.addEventListener('input', updateFromSliders);
                smoothingSlider.addEventListener('input', updateFromSliders);

                // Buttons
                downloadBtn.addEventListener('click', downloadResult);
                downloadBtn2.addEventListener('click', downloadResult);
                resetBtn.addEventListener('click', resetAll);

                // Initial state
                setStatus('Upload an image to get started');

                // Observe canvas size changes
                if (window.ResizeObserver) {
                    const ro = new ResizeObserver(() => fitCanvasToWrapper());
                    document.querySelectorAll('.canvas-wrapper').forEach(el => ro.observe(el));
                }
            }

            // Override loadImage to also fit canvases
            const origLoadImage = loadImage;
            loadImage = function(file) {
                origLoadImage(file);
                // fit after image loads
                setTimeout(fitCanvasToWrapper, 100);
            };

            // Also fit after processing
            const origProcess = processImage;
            processImage = function() {
                origProcess.call(this);
                setTimeout(fitCanvasToWrapper, 50);
            };

            // Start
            document.addEventListener('DOMContentLoaded', init);

            // Expose for debugging
            window.__app = {
                processImage,
                resetAll,
                downloadResult,
                setTolerance: (v) => { toleranceSlider.value = v;
                    updateFromSliders(); },
                setSmoothing: (v) => { smoothingSlider.value = v;
                    updateFromSliders(); }
            };

        })();
    </script>

</body>
</html>
